<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filamente 3D — Stock & Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0F0F0D;
  --bg2: #161614;
  --bg3: #1E1E1B;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #F2F0E8;
  --muted: #7A786E;
  --light: #4A4A44;
  --accent: #C8F060;
  --accent2: #9DC43A;
  --accent-dark: #1A2A00;
  --danger: #FF6B5B;
  --danger-bg: rgba(255,107,91,0.1);
  --warn: #F0B429;
  --warn-bg: rgba(240,180,41,0.1);
  --ok: #C8F060;
  --ok-bg: rgba(200,240,96,0.1);
  --r: 12px;
  --rs: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Instrument Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── LOADING SCREEN ── */
#loadScreen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 1000;
  transition: opacity 0.5s ease;
}
#loadScreen.hide { opacity: 0; pointer-events: none; }
.load-logo {
  font-family: 'Syne', sans-serif;
  font-size: 32px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -1px;
  margin-bottom: 2rem;
}
.load-bar-wrap {
  width: 200px;
  height: 2px;
  background: var(--bg3);
  border-radius: 2px;
  overflow: hidden;
}
.load-bar {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.3s ease;
  border-radius: 2px;
}
.load-txt {
  margin-top: 1rem;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ── HEADER ── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,15,13,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  height: 64px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo {
  display: flex; align-items: center; gap: 12px;
  text-decoration: none;
}
.logo-mark {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.logo-mark svg { width: 20px; height: 20px; }
.logo-name {
  font-family: 'Syne', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.5px;
}
.logo-name span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 16px; }
.sync-pill {
  display: flex; align-items: center; gap: 7px;
  font-size: 11px;
  color: var(--muted);
  font-family: 'Instrument Sans', monospace;
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 20px;
  letter-spacing: 0.3px;
}
.sync-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 2.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(0.8)} }

/* ── HERO STATS ── */
.hero {
  padding: 3rem 2rem 2rem;
  border-bottom: 1px solid var(--border);
}
.hero-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(28px, 4vw, 48px);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -1.5px;
  margin-bottom: 0.5rem;
}
.hero-title em { color: var(--accent); font-style: normal; }
.hero-sub { font-size: 14px; color: var(--muted); margin-bottom: 2rem; }
.stats-row {
  display: flex; gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  max-width: 600px;
}
.stat {
  flex: 1;
  background: var(--bg2);
  padding: 1rem 1.25rem;
}
.stat .v {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1;
  margin-bottom: 4px;
}
.stat .l {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

/* ── MAIN LAYOUT ── */
.page {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: calc(100vh - 64px);
}

/* ── SIDEBAR ── */
.sidebar {
  background: var(--bg2);
  border-right: 1px solid var(--border);
  padding: 1.5rem 1.25rem;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--light); border-radius: 2px; }

.s-section {}
.s-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--light);
  margin-bottom: 8px;
  font-family: 'Syne', sans-serif;
}
.search-wrap { position: relative; }
.search-wrap svg {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; opacity: 0.4;
}
input.search {
  width: 100%;
  padding: 9px 12px 9px 32px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--rs);
  font-size: 13px;
  font-family: 'Instrument Sans', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
input.search:focus { border-color: var(--border2); }
input.search::placeholder { color: var(--light); }

.stock-btns { display: flex; flex-direction: column; gap: 4px; }
.s-btn {
  padding: 8px 10px;
  border-radius: var(--rs);
  font-size: 12px;
  font-family: 'Instrument Sans', sans-serif;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.12s;
  border: 1px solid transparent;
  background: none;
  text-align: left;
  width: 100%;
  display: flex; align-items: center; gap: 8px;
}
.s-btn:hover { background: var(--bg3); color: var(--text); }
.s-btn.on { background: var(--bg3); border-color: var(--border2); color: var(--text); }
.s-btn .dot2 { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.brand-list, .cat-list { display: flex; flex-direction: column; gap: 2px; }
.f-btn {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px;
  border-radius: var(--rs);
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.12s;
  border: none; background: none;
  text-align: left; width: 100%;
  font-family: 'Instrument Sans', sans-serif;
}
.f-btn:hover { background: var(--bg3); color: var(--text); }
.f-btn.on { background: var(--accent-dark); color: var(--accent); border: 1px solid rgba(200,240,96,0.2); }
.f-btn .n {
  font-size: 10px;
  background: var(--bg3);
  padding: 1px 6px;
  border-radius: 10px;
  color: var(--light);
  flex-shrink: 0;
}
.f-btn.on .n { background: rgba(200,240,96,0.15); color: var(--accent); }

/* ── MAIN CONTENT ── */
.main { overflow-y: auto; }
.main-inner { padding: 1.75rem 2rem; }

/* ── CATEGORY ── */
.cat-section { margin-bottom: 2.5rem; }
.cat-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 1rem;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.cat-name {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.cat-brand {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 20px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.brand-bambu { background: rgba(200,240,96,0.12); color: var(--accent); }
.brand-proflab { background: rgba(100,150,255,0.12); color: #8AABFF; }
.brand-anycubic { background: rgba(255,150,80,0.12); color: #FFB080; }
.brand-other { background: rgba(200,200,200,0.1); color: var(--muted); }

.cat-price {
  font-size: 12px;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  color: var(--accent);
  margin-left: 2px;
}
.cat-count { margin-left: auto; font-size: 11px; color: var(--light); }

/* ── PRODUCT GRID ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 8px;
}
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.1s;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--swatch-color, transparent);
  opacity: 0;
  transition: opacity 0.2s;
}
.card:hover { border-color: var(--border2); background: var(--bg3); transform: translateY(-2px); }
.card:hover::before { opacity: 1; }
.card.oos { opacity: 0.4; }
.card.oos:hover { transform: none; }

.swatch {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 10px;
  position: relative;
}
.swatch.metallic {
  background: linear-gradient(135deg, #C0C0C0 0%, #E8E8E8 40%, #A0A0A0 60%, #D0D0D0 100%) !important;
}
.swatch.translucent { opacity: 0.7; }

.p-name {
  font-size: 12px; font-weight: 500;
  line-height: 1.3; margin-bottom: 2px;
  color: var(--text);
}
.p-code {
  font-size: 10px; color: var(--light);
  font-family: 'Instrument Sans', monospace;
  margin-bottom: 8px;
  letter-spacing: 0.3px;
}
.p-foot { display: flex; align-items: center; justify-content: space-between; }
.p-price {
  font-size: 12px; font-weight: 600;
  color: var(--accent);
  font-family: 'Syne', sans-serif;
}
.badge {
  font-size: 10px; font-weight: 500;
  padding: 2px 6px;
  border-radius: 4px;
}
.b-ok { background: var(--ok-bg); color: var(--ok); }
.b-low { background: var(--warn-bg); color: var(--warn); }
.b-out { background: var(--danger-bg); color: var(--danger); }

/* ── MODAL ── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 500;
  align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}
.overlay.open { display: flex; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 2rem;
  max-width: 400px; width: 92%;
  position: relative;
  box-shadow: 0 40px 80px rgba(0,0,0,0.6);
  animation: popIn 0.2s ease;
}
@keyframes popIn {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.m-close {
  position: absolute; top: 16px; right: 16px;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg3);
  cursor: pointer;
  color: var(--muted);
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
}
.m-close:hover { background: var(--border); color: var(--text); }
.m-swatch {
  width: 64px; height: 64px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 1.25rem;
}
.m-title {
  font-family: 'Syne', sans-serif;
  font-size: 20px; font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 3px;
}
.m-cat { font-size: 13px; color: var(--muted); margin-bottom: 1.5rem; }
.m-rows { display: flex; flex-direction: column; gap: 0; }
.m-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.m-row:last-child { border-bottom: none; }
.m-lbl { color: var(--muted); }
.m-val { font-weight: 500; font-family: 'Syne', sans-serif; font-size: 13px; }

/* ── EMPTY ── */
.empty {
  text-align: center; padding: 4rem 2rem;
  color: var(--muted); font-size: 14px;
}
.empty svg { width: 48px; height: 48px; opacity: 0.2; margin-bottom: 1rem; display: block; margin-left: auto; margin-right: auto; }

/* ── ERROR ── */
.err {
  background: var(--danger-bg);
  border: 1px solid rgba(255,107,91,0.2);
  border-radius: var(--r);
  padding: 1rem 1.25rem;
  margin-bottom: 1.5rem;
  font-size: 13px;
  color: var(--danger);
  line-height: 1.6;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--light); border-radius: 3px; }

/* ── MOBILE ── */
@media (max-width: 768px) {
  .hero { padding: 1.5rem; }
  .page { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  .stats-row { max-width: 100%; }
  .stat .v { font-size: 22px; }
  .main-inner { padding: 1.25rem; }
  .header { padding: 0 1rem; }
  .hero-title { font-size: 24px; }
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loadScreen">
  <div class="load-logo">FIL<span style="color:#fff">3D</span></div>
  <div class="load-bar-wrap"><div class="load-bar" id="loadBar"></div></div>
  <div class="load-txt" id="loadTxt">Se încarcă...</div>
</div>

<!-- HEADER -->
<header class="header">
  <a class="logo" href="#">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0F0F0D" stroke-width="2.5" stroke-linecap="round">
        <path d="M12 2L2 7l10 5 10-5-10-5M2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div class="logo-name">FIL<span>3D</span></div>
  </a>
  <div class="header-right">
    <div class="sync-pill">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncTxt">Se conectează...</span>
    </div>
  </div>
</header>

<!-- HERO -->
<div class="hero">
  <div class="hero-title">Stoc filamente <em>3D</em></div>
  <div class="hero-sub">Actualizat live din inventar · toate brandurile</div>
  <div class="stats-row">
    <div class="stat">
      <div class="v" id="s1">—</div>
      <div class="l">Produse</div>
    </div>
    <div class="stat">
      <div class="v" id="s2" style="color:var(--ok)">—</div>
      <div class="l">În stoc</div>
    </div>
    <div class="stat">
      <div class="v" id="s3" style="color:var(--danger)">—</div>
      <div class="l">Fără stoc</div>
    </div>
    <div class="stat">
      <div class="v" id="s4">—</div>
      <div class="l">Unități</div>
    </div>
  </div>
</div>

<!-- PAGE -->
<div class="page">
  <aside class="sidebar">
    <div class="s-section">
      <div class="s-label">Caută</div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search" type="text" id="search" placeholder="Culoare, categorie, cod..." oninput="render()">
      </div>
    </div>

    <div class="s-section">
      <div class="s-label">Disponibilitate</div>
      <div class="stock-btns">
        <button class="s-btn on" id="sAll" onclick="setStock('all')">
          <span class="dot2" style="background:var(--muted)"></span> Toate produsele
        </button>
        <button class="s-btn" id="sIn" onclick="setStock('in')">
          <span class="dot2" style="background:var(--ok)"></span> Doar în stoc
        </button>
        <button class="s-btn" id="sOut" onclick="setStock('out')">
          <span class="dot2" style="background:var(--danger)"></span> Fără stoc
        </button>
      </div>
    </div>

    <div class="s-section">
      <div class="s-label">Brand</div>
      <div class="brand-list" id="brandList"></div>
    </div>

    <div class="s-section" style="flex:1;overflow-y:auto;min-height:0">
      <div class="s-label">Categorie</div>
      <div class="cat-list" id="catList"></div>
    </div>
  </aside>

  <div class="main">
    <div class="main-inner">
      <div id="errBox"></div>
      <div id="content"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="m-close" onclick="document.getElementById('overlay').classList.remove('open')">×</button>
    <div class="m-swatch" id="mSwatch"></div>
    <div class="m-title" id="mTitle"></div>
    <div class="m-cat" id="mCat"></div>
    <div class="m-rows" id="mRows"></div>
  </div>
</div>

  'concrete':'#93A1A1','brick':'#CB4154','cooper':'#B87333','coffee':'#6F4E37',
  'oak':'#7D5A4F','ocean blue':'#1B4F72',
  'trans blue':'rgba(66,165,245,0.5)','trans red':'rgba(239,83,80,0.5)',
  'trans green':'rgba(102,187,106,0.5)','trans yellow':'rgba(255,241,118,0.6)',
  'tangerine yellow':'#FFCC00','azzure':'#007FFF','olive':'#808000',
  'texture gray':'#A8A8A8','texture silver':'#D4D4D4',
  'light blue':'#87CEEB','blue hawaii':'#0094BB','aurora purple':'#9B59B6',
  'midnight blaze':'#FF4500','phantom blue':'#003153','mystic magenta':'#CC338B',
  'velvet eclipse':'#2C0040','neon city':'#FF00FF','gilded rose':'#C5907E',
  'south beach':'#FF7F7F','dawn radiance':'#FFB347','shiny gold':'#FFD700',
  'christmas green':'#006400','christmas red':'#CC0000','metal blue':'#4169E1',
  'rainbow':'linear-gradient(135deg,#FF6B6B,#FFE66D,#4ECDC4,#44A3DC,#7C4DFF)',
  'olive green':'#6B8E23','silver':'#C0C0C0'
};

const METALLIC = ['silver','gold','bronze','brass','titan gray','rose gold','shiny gold','champagne','glamour'];
const TRANSLUCENT_KW = ['translucent','trans ','transparent','clear'];

function getColor(name) {
  if (!name) return '#3A3A35';
  const k = name.toLowerCase().trim();
  return COLOR_MAP[k] || '#3A3A35';
}

function isMetal(name) { return METALLIC.some(m => name.toLowerCase().includes(m)); }
function isTrans(name) { return TRANSLUCENT_KW.some(t => name.toLowerCase().includes(t)); }

function brandClass(brand) {
  const b = (brand||'').toLowerCase();
  if (b.includes('bambu')) return 'brand-bambu';
  if (b.includes('prof') || b.includes('lab')) return 'brand-proflab';
  if (b.includes('anycubic')) return 'brand-anycubic';
  return 'brand-other';
}

// ── DATA ──────────────────────────────────────────────────────
let ALL = [];
let stockFilter = 'all';
let activeBrand = '';
let activeCat = '';

async function loadData() {
  setLoad(10, 'Se conectează la inventar...');
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
  try {
    setLoad(40, 'Se descarcă datele...');
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const csv = await res.text();
    setLoad(70, 'Se procesează produsele...');
    ALL = parseCSV(csv);
    if (ALL.length === 0) throw new Error('empty');
    document.getElementById('syncDot').style.background = 'var(--accent)';
    document.getElementById('syncTxt').textContent = 'Live · ' + new Date().toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('errBox').innerHTML = '';
  } catch(e) {
    document.getElementById('syncDot').style.background = 'var(--danger)';
    document.getElementById('syncTxt').textContent = 'Eroare conexiune';
    document.getElementById('errBox').innerHTML = `<div class="err">
      ⚠️ Nu pot citi datele din Google Sheets.<br>
      Verifică: foaia e publică (Anyone with link → Viewer), foaia se numește exact <strong>Marketplace</strong> și scriptul a fost rulat cel puțin o dată.
    </div>`;
  }
  setLoad(100, 'Gata!');
  setTimeout(() => {
    document.getElementById('loadScreen').classList.add('hide');
    setTimeout(() => document.getElementById('loadScreen').remove(), 500);
  }, 300);
  buildFilters();
  render();
  setTimeout(loadData, 60000);
}

function setLoad(pct, txt) {
  document.getElementById('loadBar').style.width = pct + '%';
  document.getElementById('loadTxt').textContent = txt;
}

function parseCSV(csv) {
  const lines = csv.trim().split('\n');
  if (lines.length < 2) return [];
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = splitCSV(lines[i]);
    if (!cols || cols.length < 4) continue;
    const brand = clean(cols[0]);
    const cat   = clean(cols[1]);
    const col   = clean(cols[2]);
    const cod   = clean(cols[3]);
    const pret  = parseInt(cols[4]) || 0;
    const stoc  = parseInt(cols[5]) || 0;
    if (!cat || !col) continue;
    out.push({ brand, cat, col, cod, pret, stoc });
  }
  return out;
}

function splitCSV(line) {
  const r = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') { q = !q; continue; }
    if (line[i] === ',' && !q) { r.push(cur.trim()); cur = ''; continue; }
    cur += line[i];
  }
  r.push(cur.trim());
  return r;
}

function clean(s) { return String(s||'').replace(/^"|"$/g,'').trim(); }

// ── FILTERS ──────────────────────────────────────────────────
function buildFilters() {
  const brands = [...new Set(ALL.map(p=>p.brand).filter(Boolean))].sort();
  let bh = `<button class="f-btn on" onclick="setBrand('')">Toate <span class="n">${brands.length}</span></button>`;
  brands.forEach(b => {
    bh += `<button class="f-btn" onclick="setBrand('${esc(b)}')">${b} <span class="n">${ALL.filter(p=>p.brand===b).length}</span></button>`;
  });
  document.getElementById('brandList').innerHTML = bh;
  buildCats();
}

function buildCats() {
  const src = activeBrand ? ALL.filter(p=>p.brand===activeBrand) : ALL;
  const cats = [...new Set(src.map(p=>p.cat))].sort();
  let ch = `<button class="f-btn on" onclick="setCat('')">Tutte <span class="n">${cats.length}</span></button>`;
  cats.forEach(c => {
    ch += `<button class="f-btn" onclick="setCat('${esc(c)}')">${c} <span class="n">${src.filter(p=>p.cat===c).length}</span></button>`;
  });
  document.getElementById('catList').innerHTML = ch;
}

function setBrand(b) {
  activeBrand = b; activeCat = '';
  document.querySelectorAll('#brandList .f-btn').forEach(btn => {
    btn.classList.toggle('on', (b === '' ? btn.textContent.trim().startsWith('Toate') : btn.textContent.trim().startsWith(b)));
  });
  buildCats();
  render();
}

function setCat(c) {
  activeCat = c;
  document.querySelectorAll('#catList .f-btn').forEach(btn => {
    btn.classList.toggle('on', (c === '' ? btn.textContent.trim().startsWith('Tutte') : btn.textContent.trim().startsWith(c)));
  });
  render();
}

function setStock(v) {
  stockFilter = v;
  document.getElementById('sAll').classList.toggle('on', v==='all');
  document.getElementById('sIn').classList.toggle('on', v==='in');
  document.getElementById('sOut').classList.toggle('on', v==='out');
  render();
}

// ── RENDER ────────────────────────────────────────────────────
function render() {
  const q = (document.getElementById('search').value||'').toLowerCase();
  const filtered = ALL.filter(p => {
    if (activeBrand && p.brand !== activeBrand) return false;
    if (activeCat && p.cat !== activeCat) return false;
    if (q && !p.col.toLowerCase().includes(q) && !p.cat.toLowerCase().includes(q) && !p.cod.toLowerCase().includes(q)) return false;
    if (stockFilter==='in' && p.stoc===0) return false;
    if (stockFilter==='out' && p.stoc>0) return false;
    return true;
  });

  document.getElementById('s1').textContent = filtered.length;
  document.getElementById('s2').textContent = filtered.filter(p=>p.stoc>0).length;
  document.getElementById('s3').textContent = filtered.filter(p=>p.stoc===0).length;
  document.getElementById('s4').textContent = filtered.reduce((a,p)=>a+p.stoc,0);

  // Grupeaza Brand > Categorie
  const grouped = {};
  filtered.forEach(p => {
    const key = `${p.brand}||${p.cat}`;
    if (!grouped[key]) grouped[key] = { brand: p.brand, cat: p.cat, pret: p.pret, items: [] };
    grouped[key].items.push(p);
  });

  let html = '';
  Object.keys(grouped).sort().forEach(key => {
    const g = grouped[key];
    const bc = brandClass(g.brand);
    html += `<div class="cat-section">
      <div class="cat-head">
        <span class="cat-name">${g.cat}</span>
        <span class="cat-brand ${bc}">${g.brand}</span>
        ${g.pret ? `<span class="cat-price">${g.pret} lei</span>` : ''}
        <span class="cat-count">${g.items.length} var.</span>
      </div>
      <div class="grid">`;

    g.items.forEach(p => {
      const oos = p.stoc === 0;
      const low = p.stoc > 0 && p.stoc <= 5;
      const color = getColor(p.col);
      const metal = isMetal(p.col);
      const trans = isTrans(p.col);
      const badgeCls = oos ? 'b-out' : low ? 'b-low' : 'b-ok';
      const badgeTxt = oos ? 'Fără stoc' : `${p.stoc} buc`;
      const swatchStyle = color.startsWith('linear') ? `background:${color}` : `background:${color}`;
      const pData = encodeURIComponent(JSON.stringify(p));

      html += `<div class="card${oos?' oos':''}" style="--swatch-color:${color.startsWith('rgba')||color.startsWith('linear')?'#666':color}" onclick="openModal('${pData}')">
        <div class="swatch${metal?' metallic':''}${trans?' translucent':''}" style="${swatchStyle}"></div>
        <div class="p-name">${p.col}</div>
        <div class="p-code">${p.cod ? '#'+p.cod : p.brand}</div>
        <div class="p-foot">
          <span class="p-price">${p.pret||'—'} lei</span>
          <span class="badge ${badgeCls}">${badgeTxt}</span>
        </div>
      </div>`;
    });

    html += '</div></div>';
  });

  if (!html) html = `<div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    Niciun produs găsit pentru filtrele selectate.
  </div>`;

  document.getElementById('content').innerHTML = html;
}

// ── MODAL ─────────────────────────────────────────────────────
function openModal(pData) {
  const p = JSON.parse(decodeURIComponent(pData));
  const color = getColor(p.col);
  const metal = isMetal(p.col);
  document.getElementById('mSwatch').style.cssText = metal
    ? 'background:linear-gradient(135deg,#C0C0C0 0%,#E8E8E8 40%,#A0A0A0 60%,#D0D0D0 100%)'
    : `background:${color}`;
  document.getElementById('mTitle').textContent = p.col;
  document.getElementById('mCat').textContent = p.cat + ' · ' + p.brand;
  const oos = p.stoc===0, low = p.stoc>0 && p.stoc<=5;
  const sc = oos?'b-out':low?'b-low':'b-ok';
  document.getElementById('mRows').innerHTML = `
    ${p.cod ? `<div class="m-row"><span class="m-lbl">Cod produs</span><span class="m-val">#${p.cod}</span></div>` : ''}
    <div class="m-row"><span class="m-lbl">Preț</span><span class="m-val">${p.pret||'—'} lei / rolă</span></div>
    <div class="m-row"><span class="m-lbl">Stoc</span><span class="m-val"><span class="badge ${sc}">${p.stoc===0?'Fără stoc':p.stoc+' bucăți'}</span></span></div>
    <div class="m-row"><span class="m-lbl">Tip</span><span class="m-val">${p.cat.includes('Spool')||p.cat.includes('SPOOL')?'Spool complet':p.cat.includes('Refill')||p.cat.includes('REFILL')?'Refill (fără spool)':p.cat}</span></div>
    <div class="m-row"><span class="m-lbl">Brand</span><span class="m-val">${p.brand}</span></div>
  `;
  document.getElementById('overlay').classList.add('open');
}

function closeModal(e) {
  if (e.target===document.getElementById('overlay')) document.getElementById('overlay').classList.remove('open');
}

function esc(s) { return String(s).replace(/'/g,"\\'"); }

loadData();
</script>
</body>
</html>
